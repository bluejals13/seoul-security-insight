[project]
name = "job-insight"
version = "0.1.0"
description = "서울시 보안 서비스"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "folium>=0.20.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "selenium>=4.25,<5.0",
    "streamlit>=1.40,<2.0",
    "streamlit-folium>=0.27.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false
